[project]
name = "demanda-dinero"
version = "0.1.0"
description = "Réplica del modelo de demanda real de dinero del BCRA (IPOM dic-2025, AT 5) y pipeline mensual"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "tabulate>=0.10.0",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "pypdf>=6.21.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
